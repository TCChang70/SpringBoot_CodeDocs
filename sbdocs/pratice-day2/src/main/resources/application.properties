spring.application.name=pratice-day1
# (1) 預設埠號 8080
server.port=8080

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# (2) MySQL 連線字串（含 UTF8MB4、關閉 SSL、設定時區）
spring.datasource.url=jdbc:mysql://localhost:3306/product_db?useSSL=false&characterEncoding=utf8

# (3) 開發環境用 update（自動比對 Entity 與資料表，首次建表，之後只加欄位）
spring.jpa.hibernate.ddl-auto=create-drop

# (4) true → Console 顯示實際執行的 SQL，方便除錯
spring.jpa.show-sql=true

# (5) true → SQL 格式化顯示，換行縮排，更容易看懂
spring.jpa.properties.hibernate.format_sql=true

# 啟動時執行 data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql