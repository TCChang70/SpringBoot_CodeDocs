spring.application.name=ecommerce-shop

server.port=8080

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:shop.db

# SQLite 不支援 Hibernate 的 schema 生成（7.4 社群 Dialect 會產生壞的 id 欄位），改用手動 schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.tags-sorter=alpha

# ===== JWT 設定（jjwt） =====
# 密鑰（HS256 至少需 32 字元），正式環境請改用環境變數並定期更換
jwt.secret=ChangeThisSecretKeyToA32PlusCharsLongRandomValue2026!
# Token 有效期（毫秒）＝ 24 小時
jwt.expiration-ms=86400000
